<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Leksakslan</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0f1729;--navy-2:#1a2540;--accent:#4f8ef7;--accent-2:#3a7af0;
  --text:#f0f4ff;--text-muted:#8896b0;--surface:#1e2d4a;--surface-2:#253654;
  --border:rgba(255,255,255,0.08);--radius:14px;--radius-sm:8px;
  --shadow:0 4px 24px rgba(0,0,0,0.3);--sidebar-w:240px;--header-h:60px;
  --green:#4ade80;--green-bg:rgba(74,222,128,0.12);
  --red:#f87171;--red-bg:rgba(248,113,113,0.12);
  --orange:#fb923c;--orange-bg:rgba(251,146,60,0.12);
}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--navy);color:var(--text);font-size:16px;-webkit-font-smoothing:antialiased}
.app{display:flex;height:100dvh;position:relative}

/* OFFLINE BANNER */
.offline-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:999;background:#b45309;color:#fff;text-align:center;font-size:13px;font-weight:600;padding:6px}
.offline-banner.show{display:block}

/* OVERLAY */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:90;backdrop-filter:blur(2px)}
.overlay.active{display:block}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);background:var(--navy-2);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;flex-shrink:0;transition:transform 0.3s cubic-bezier(0.4,0,0.2,1)}
.sidebar-brand{padding:24px 20px 16px;border-bottom:1px solid var(--border)}
.sidebar-brand h1{font-size:18px;font-weight:700;color:var(--accent);letter-spacing:-0.3px}
.sidebar-brand p{font-size:12px;color:var(--text-muted);margin-top:2px}
.sidebar nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:4px}
.nav-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);border:none;background:transparent;color:var(--text-muted);font-size:15px;cursor:pointer;text-align:left;width:100%;transition:background 0.15s,color 0.15s;font-family:inherit}
.nav-btn:hover{background:var(--surface);color:var(--text)}
.nav-btn.active{background:var(--accent-2);color:#fff}
.nav-icon{font-size:18px;width:22px;text-align:center;flex-shrink:0}
.sidebar-footer{padding:12px 10px;border-top:1px solid var(--border)}

@media(max-width:768px){
  .sidebar{position:fixed;top:0;left:0;height:100%;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  #menuToggle{display:flex!important}
}

/* TOPBAR */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:var(--header-h);display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);background:var(--navy-2);gap:12px;flex-shrink:0}
#menuToggle{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:6px;border-radius:var(--radius-sm);line-height:1}
.topbar-title{font-size:17px;font-weight:600;flex:1}
.online-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;transition:background 0.3s}
.online-dot.offline{background:var(--red)}
.topbar-badge{background:var(--accent-2);color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}

#view{flex:1;overflow-y:auto;padding:20px}
#view::-webkit-scrollbar{width:6px}
#view::-webkit-scrollbar-track{background:transparent}
#view::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:3px}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;height:50vh;flex-direction:column;gap:14px;color:var(--text-muted)}
.loading .spin{font-size:36px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* VIEW HEADER */
.view-header{margin-bottom:20px}
.view-header h2{font-size:22px;font-weight:700}
.view-header p{font-size:13px;color:var(--text-muted);margin-top:4px}

/* BREADCRUMB */
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);margin-bottom:20px;flex-wrap:wrap}
.bc-item{cursor:pointer;transition:color 0.15s}
.bc-item:hover{color:var(--accent)}
.bc-sep{opacity:0.4}
.bc-cur{color:var(--text);font-weight:600}

/* PICK GRID */
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.pick-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;transition:border-color 0.15s,transform 0.15s,background 0.15s}
.pick-card:hover{border-color:var(--accent);background:var(--surface-2);transform:translateY(-2px)}
.pc-emoji{font-size:38px;line-height:1}
.pc-label{font-weight:700;font-size:15px}
.pc-sub{font-size:12px;color:var(--text-muted)}

/* CHILDREN */
.child-list{display:flex;flex-direction:column;gap:8px}
.child-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color 0.15s,background 0.15s}
.child-row:hover:not(.locked){border-color:var(--accent);background:var(--surface-2)}
.child-row.locked{cursor:default;border-color:rgba(251,146,60,0.35)}
.child-avatar{width:42px;height:42px;border-radius:50%;background:var(--accent-2);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.child-avatar.warn{background:var(--orange-bg);font-size:20px}
.child-info{flex:1;min-width:0}
.child-name{font-weight:600;font-size:15px}
.child-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.child-sub.warn{color:var(--orange)}
.pill{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;flex-shrink:0}
.pill.free{background:var(--green-bg);color:var(--green)}
.pill.busy{background:var(--orange-bg);color:var(--orange)}

/* TOYS */
.toy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.toy-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;transition:border-color 0.15s,transform 0.15s,background 0.15s}
.toy-card:hover:not(.out){border-color:var(--accent);background:var(--surface-2);transform:translateY(-2px)}
.toy-card.out{opacity:0.38;cursor:not-allowed}
.toy-emoji{font-size:40px;line-height:1}
.toy-name{font-weight:700;font-size:14px}
.toy-pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}
.toy-pill.ok{background:var(--green-bg);color:var(--green)}
.toy-pill.low{background:var(--red-bg);color:var(--red)}
.toy-pill.out{background:rgba(255,255,255,0.06);color:var(--text-muted)}

/* LOANS */
.loan-list{display:flex;flex-direction:column;gap:8px}
.loan-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 16px;display:flex;align-items:center;gap:14px}
.loan-icon{font-size:30px}
.loan-info{flex:1;min-width:0}
.loan-name{font-weight:600;font-size:15px}
.loan-meta{font-size:12px;color:var(--text-muted);margin-top:2px}
.btn-ret{padding:8px 14px;border-radius:var(--radius-sm);background:var(--red-bg);color:var(--red);border:1px solid rgba(248,113,113,0.2);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:background 0.15s,color 0.15s;white-space:nowrap}
.btn-ret:hover{background:var(--red);color:#fff}

/* BUTTONS */
.btn{padding:10px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;border:none;transition:filter 0.15s,transform 0.15s}
.btn:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-primary{background:var(--accent-2);color:#fff}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(248,113,113,0.2)}
.btn-danger:hover:not(:disabled){background:var(--red)!important;color:#fff!important;filter:none}

/* ADMIN */
.adm-sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.adm-sec h3{font-size:16px;font-weight:700;margin-bottom:16px}
.adm-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border-radius:var(--radius-sm);margin-bottom:6px;border:1px solid var(--border)}
.adm-row .ar-em{font-size:20px}
.adm-row .ar-nm{flex:1;font-weight:600;font-size:14px}
.adm-row .ar-sb{font-size:12px;color:var(--text-muted)}
.cnt-ctrl{display:flex;align-items:center;gap:6px}
.cnt-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:border-color 0.15s;line-height:1}
.cnt-btn:hover{border-color:var(--accent)}
.cnt-num{font-weight:700;font-size:15px;min-width:24px;text-align:center}
.add-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:14px;border-top:1px solid var(--border)}
.field{flex:1;min-width:100px;padding:9px 12px;background:var(--navy);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color 0.15s}
.field::placeholder{color:var(--text-muted)}
.field:focus{border-color:var(--accent-2)}
select.field{cursor:pointer}
.cls-block{background:var(--surface-2);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;border:1px solid var(--border)}
.cls-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cls-title{font-weight:700;font-size:14px;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 10px 4px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.tag-x{background:none;border:none;cursor:pointer;color:var(--red);font-size:16px;padding:0;line-height:1;opacity:0.7}
.tag-x:hover{opacity:1}
.promo-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent-2);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.promo-card h3{font-size:16px;font-weight:700;margin-bottom:6px}
.promo-card>p{font-size:13px;color:var(--text-muted);margin-bottom:16px}
.promo-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.promo-row:last-of-type{border:none}
.promo-from{flex:1;font-weight:600}
.promo-arr{color:var(--accent)}
.promo-to{color:var(--text-muted);font-size:13px}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;backdrop-filter:blur(4px)}
.modal-bg.hidden{display:none}
.modal{background:var(--navy-2);border:1px solid var(--border);border-radius:var(--radius);padding:28px;max-width:400px;width:100%;box-shadow:var(--shadow);animation:pop 0.18s ease}
@keyframes pop{from{transform:scale(0.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{font-size:20px;font-weight:700;margin-bottom:8px}
.modal>p{font-size:14px;color:var(--text-muted);margin-bottom:20px}
.modal-acts{display:flex;gap:10px;justify-content:flex-end}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface-2);color:var(--text);border:1px solid var(--border);padding:11px 22px;border-radius:100px;font-weight:600;font-size:14px;z-index:300;transition:transform 0.25s ease;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

/* EMPTY */
.empty{text-align:center;padding:48px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .ei{font-size:52px}
.empty p{font-size:15px;font-weight:500;color:var(--text-muted)}

/* SEARCH */
.search-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit;outline:none;width:100%;margin-bottom:16px;transition:border-color 0.15s}
.search-box:focus{border-color:var(--accent-2)}
.search-box::placeholder{color:var(--text-muted)}
</style>
</head>
<body>
<div class="offline-banner" id="offline-banner">⚠️ Ingen internetanslutning</div>
<div class="app">

<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <h1>🏫 Leksakslan</h1>
    <p>Skolgårdsbibliotek</p>
  </div>
  <nav>
    <button class="nav-btn active" id="nb-klass" onclick="go('klass')">
      <span class="nav-icon">🏷️</span> Välj klass
    </button>
    <button class="nav-btn" id="nb-lan" onclick="go('lan')">
      <span class="nav-icon">📋</span> Aktiva lån
    </button>
  </nav>
  <div class="sidebar-footer">
    <button class="nav-btn" id="nb-admin" onclick="go('admin')">
      <span class="nav-icon">⚙️</span> Admin
    </button>
  </div>
</aside>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div class="content">
  <div class="topbar">
    <button id="menuToggle" onclick="toggleSidebar()">☰</button>
    <div class="topbar-title" id="topbar-title">Välj klass</div>
    <div class="online-dot" id="online-dot"></div>
    <div class="topbar-badge" id="tbadge" style="display:none"></div>
  </div>
  <div id="view"><div class="loading"><div class="spin">🔄</div><div>Laddar data…</div></div></div>
</div>

</div>

<div class="modal-bg hidden" id="mbg" onclick="mbgClick(event)">
  <div class="modal">
    <h3 id="mt"></h3>
    <p id="md"></p>
    <div id="mb"></div>
    <div class="modal-acts" id="ma"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script>
// ═══════════════════════════════════════════
//  FIREBASE
// ═══════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyA4P8w8P_Wed-KWTpfhq4Z0wAQ_Jycgmds",
  authDomain: "boden-dd98f.firebaseapp.com",
  projectId: "boden-dd98f",
  storageBucket: "boden-dd98f.firebasestorage.app",
  messagingSenderId: "476168825372",
  appId: "1:476168825372:web:96eb33e2f6fb43eac28dd9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ═══════════════════════════════════════════
//  ONLINE / OFFLINE
// ═══════════════════════════════════════════
function setOnline(on) {
  document.getElementById('online-dot').classList.toggle('offline', !on);
  document.getElementById('offline-banner').classList.toggle('show', !on);
}
window.addEventListener('online',  () => setOnline(true));
window.addEventListener('offline', () => setOnline(false));
setOnline(navigator.onLine);

// ═══════════════════════════════════════════
//  XSS SAFETY
// ═══════════════════════════════════════════
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ═══════════════════════════════════════════
//  DEFAULT DATA (used only first time)
// ═══════════════════════════════════════════
const INIT_VERSION = 'leksak-v1';

const DEFAULT_GRADES = [
  { id:'g0', name:'Åk 0 (Förskoleklass)', emoji:'🌱', classes:['Fa','Fb','Fc'], order:0 },
  { id:'g1', name:'Åk 1', emoji:'1️⃣', classes:['1A','1B'], order:1 },
  { id:'g2', name:'Åk 2', emoji:'2️⃣', classes:['2A','2B','2C','2D'], order:2 },
];

const DEFAULT_CHILDREN = {
  'Fa':['Melina','Himank','Lara','Liam','Atlas','Angelo','Derin','Diya','Josef','Marcus','Melvin','Mikael','Nicholas','Sam','Tyr','Kiyan','Samaira','Elin','Laura','Liana','Lukas','Princy','Zorowar','Clara','Melissa','Nina'],
  'Fb':['Kail','Mateo','Kiara','Lena','Elsa','Esther','Filip','Kefas','Liah','Oscar','Rojin','Milio','Ivica','Alva','Hanna','Linn','Liv','Stella','Tim','Edward','Karl','Nirupam','Amelia','Philip','Victoria'],
  'Fc':['Elise','Elsie','Freja','Mio','Theodor','Lillie','Raphael','William','Celine','Oskar','Anaaya','Damien','Liam','Oliver','Svante','Amelie','Magizhnira','Aryan','Ayanna','Riansh','Deekshita','Filippa','Viyan'],
  '1A':['Maxine','Noelia','Mia','Aleksandar','Bella','Harry','Leonie','Adam','August','Ema','Hildana','Lillian','Minou','Noa','Theo','Anlin','Yohan','Sveva','Vaani','Lydia','Lovis','Penny','Noah.V','Leo','Anton','Emilija'],
  '1B':['Aditya','Arvin','Baran','Jonathan','Danielle','Leia','Louise','Talya','Alicia P','Jhanvi','Tage','Justina','Matvei','Alice','Alicia RM','Emilia','Greta','Kai','Mateo','Nora','Viggo','Freja','Lou','Ellinor','Emma'],
  '2A':['Evelyn','Theodor','Draco','Elias','Mirelle','Alfred','Yibo','Filip','Melánia','Estelle','Leo','Victoria','Hugo','Hilda','Nils','Aarya','Andrei','Kendal','Maya','Mikael'],
  '2B':['Alexander','Astor','Katerina','Charles','Elin','Naya','Robin','Allan','Adrian L','Adrian CL','Chloe','Ino','Isabell','Luca','Mia','Noelle','Arnika','Cleo','Fredrika'],
  '2C':['Zekeriya','Markus','Huda','Selma','Attila','Noah','Mira','Maja','Michelle','Luka','Svea','Vincent','Defne','Fiona','Joline','Maximilian','Maximus','Nika','Victor','Melika','Sara'],
  '2D':['Liyan','Aadya','Astrid','Elisha','Lucas','Filip','Jordan','Elias','Alan','Arvid','Liam','Mayra','Miriam','Nazanin','Nova','Vincent','Linus','Astrid','Gynisha','Maria','Bilge'],
};

const DEFAULT_TOYS = [
  {id:'fotboll',    emoji:'⚽', name:'Fotboll',    total:4},
  {id:'basketboll', emoji:'🏀', name:'Basketboll', total:2},
  {id:'tennisboll', emoji:'🎾', name:'Tennisboll',  total:6},
  {id:'pingisboll', emoji:'🏓', name:'Pingisboll',  total:4},
  {id:'frisbee',    emoji:'🪃', name:'Frisbee',     total:3},
  {id:'hopprep',    emoji:'🎿', name:'Hopprep',     total:5},
];

// ═══════════════════════════════════════════
//  STATE (populated from Firestore on load)
// ═══════════════════════════════════════════
let grades  = [];   // [{id, name, emoji, classes, order}]
let children = {};  // {cls: [{name, docId}]}
let toys    = [];   // [{id, name, emoji, total, available}] — always fresh from Firestore
let loans   = [];   // [{id, child, cls, grade, toyId, toyEmoji, toyName, time}]
let nav     = {grade:null, cls:null, child:null};

// ═══════════════════════════════════════════
//  INIT — run once to seed Firestore
// ═══════════════════════════════════════════
async function initData() {
  try {
    const meta = await db.collection('meta').doc('leksak-init').get();
    if (meta.exists && meta.data().version === INIT_VERSION) return;
    // First time: seed grades
    const batch = db.batch();
    DEFAULT_GRADES.forEach(g =>
      batch.set(db.collection('grades').doc(g.id), {name:g.name, emoji:g.emoji, classes:g.classes, order:g.order}, {merge:true})
    );
    // Seed toys
    DEFAULT_TOYS.forEach(t =>
      batch.set(db.collection('toys').doc(t.id), {emoji:t.emoji, name:t.name, total:t.total, available:t.total}, {merge:true})
    );
    batch.set(db.collection('meta').doc('leksak-init'), {version:INIT_VERSION, at:firebase.firestore.Timestamp.now()});
    await batch.commit();
    // Seed children
    for (const [cls, names] of Object.entries(DEFAULT_CHILDREN)) {
      for (const name of names) {
        await db.collection('children').add({cls, name});
      }
    }
  } catch(e) { console.warn('initData:', e); }
}

// ═══════════════════════════════════════════
//  LOAD ALL STATE FROM FIRESTORE
// ═══════════════════════════════════════════
async function loadAll() {
  try {
    // Grades
    const gSnap = await db.collection('grades').get();
    grades = [];
    gSnap.forEach(doc => grades.push({id:doc.id, ...doc.data()}));
    grades.sort((a,b) => (a.order??99) - (b.order??99));

    // Toys — always load fresh so available count is correct
    const tSnap = await db.collection('toys').get();
    toys = [];
    tSnap.forEach(doc => toys.push({id:doc.id, ...doc.data()}));

    // Children
    const cSnap = await db.collection('children').get();
    children = {};
    grades.forEach(g => g.classes.forEach(cls => children[cls] = []));
    cSnap.forEach(doc => {
      const d = doc.data();
      if (!children[d.cls]) children[d.cls] = [];
      if (!children[d.cls].find(x => x.name === d.name))
        children[d.cls].push({name:d.name, docId:doc.id});
    });

    // Loans
    const lSnap = await db.collection('loans').get();
    loans = [];
    lSnap.forEach(doc => loans.push({id:doc.id, ...doc.data()}));

    badge();
  } catch(e) {
    console.warn('loadAll:', e);
    showErr('Kunde inte ladda data. Kontrollera anslutningen.');
  }
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('active');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('active');
}

function go(sec) {
  ['klass','lan','admin'].forEach(s => document.getElementById('nb-'+s).classList.toggle('active', s===sec));
  const titles = {klass:'Välj klass', lan:'Aktiva lån', admin:'Admin'};
  document.getElementById('topbar-title').textContent = titles[sec];
  closeSidebar();
  if (sec==='klass') { nav={grade:null,cls:null,child:null}; viewGrades(); }
  if (sec==='lan')   viewLoans();
  if (sec==='admin') viewAdmin();
}

function badge() {
  const el = document.getElementById('tbadge');
  if (loans.length) { el.textContent = loans.length+' aktiva lån'; el.style.display=''; }
  else el.style.display = 'none';
}

function setView(html) { document.getElementById('view').innerHTML = html; }
function showErr(msg)  { setView(`<div class="empty"><div class="ei">⚠️</div><p>${esc(msg)}</p></div>`); }

function bc() {
  const parts = [`<span class="bc-item" onclick="viewGrades()">Alla klasser</span>`];
  if (nav.grade) {
    const g = grades.find(x => x.id===nav.grade);
    if (g) parts.push(`<span class="bc-sep">›</span><span class="bc-item" onclick="viewClasses('${esc(nav.grade)}')">${esc(g.name)}</span>`);
  }
  if (nav.cls)   parts.push(`<span class="bc-sep">›</span><span class="bc-item" onclick="viewChildren('${esc(nav.cls)}')">${esc(nav.cls)}</span>`);
  if (nav.child) parts.push(`<span class="bc-sep">›</span><span class="bc-cur">${esc(nav.child)}</span>`);
  return `<div class="breadcrumb">${parts.join('')}</div>`;
}

// ═══════════════════════════════════════════
//  KLASS FLOW
// ═══════════════════════════════════════════
function viewGrades() {
  nav = {grade:null, cls:null, child:null};
  const cards = grades.map(g => {
    const tot = g.classes.reduce((a,c) => a+(children[c]?.length||0), 0);
    return `<div class="pick-card" onclick="viewClasses('${esc(g.id)}')">
      <div class="pc-emoji">${g.emoji}</div>
      <div class="pc-label">${esc(g.name)}</div>
      <div class="pc-sub">${g.classes.length} klasser · ${tot} elever</div>
    </div>`;
  }).join('');
  setView(`<div class="view-header"><h2>Välj årskurs</h2><p>Välj klass för att se elever</p></div>
    <div class="pick-grid">${cards||'<div class="empty"><div class="ei">🏫</div><p>Inga klasser</p></div>'}</div>`);
}

function viewClasses(gid) {
  nav.grade = gid; nav.cls = null; nav.child = null;
  const g = grades.find(x => x.id===gid);
  if (!g) { viewGrades(); return; }
  const cards = g.classes.map(cls => {
    const n = children[cls]?.length || 0;
    return `<div class="pick-card" onclick="viewChildren('${esc(cls)}')">
      <div class="pc-emoji">🏫</div>
      <div class="pc-label">${esc(cls)}</div>
      <div class="pc-sub">${n} elever</div>
    </div>`;
  }).join('');
  setView(`${bc()}<div class="view-header"><h2>${esc(g.name)}</h2></div>
    <div class="pick-grid">${cards}</div>`);
}

function viewChildren(cls) {
  nav.cls = cls; nav.child = null;
  const ch = children[cls] || [];
  // Search box
  const searchId = 'child-search-'+Date.now();
  const listId   = 'child-list-'+Date.now();
  const rows = ch.map(child => childRow(child.name, cls)).join('');
  setView(`${bc()}
    <div class="view-header"><h2>${esc(cls)}</h2><p>${ch.length} elever</p></div>
    <input class="search-box" id="${searchId}" placeholder="🔍 Sök elev…" oninput="filterChildren(this,'${listId}','${esc(cls)}')">
    <div class="child-list" id="${listId}">${rows||emptyEl('👤','Inga elever i klassen')}</div>`);
}

function childRow(name, cls) {
  const loan = loans.find(l => l.child===name && l.cls===cls);
  const init = name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  return `<div class="child-row ${loan?'locked':''}" ${loan?'':(`onclick="viewToys('${esc(name)}')"`)}>
    <div class="child-avatar ${loan?'warn':''}">${loan?'⚠️':init}</div>
    <div class="child-info">
      <div class="child-name">${esc(name)}</div>
      <div class="child-sub ${loan?'warn':''}">${loan?loan.toyEmoji+' '+esc(loan.toyName):'Ingen aktiv leksak'}</div>
    </div>
    <div class="pill ${loan?'busy':'free'}">${loan?'Har lån':'Ledig'}</div>
  </div>`;
}

function filterChildren(input, listId, cls) {
  const term = input.value.toLowerCase();
  const ch = (children[cls]||[]).filter(c => c.name.toLowerCase().includes(term));
  const el = document.getElementById(listId);
  if (el) el.innerHTML = ch.map(c => childRow(c.name, cls)).join('') || emptyEl('👤','Inga träffar');
}

function viewToys(name) {
  nav.child = name;
  const activeToys = toys.filter(t => t.active !== false);
  const rows = activeToys.map(toy => {
    const av = toy.available;
    const out = av === 0;
    const pc  = out ? 'out' : av<=1 ? 'low' : 'ok';
    const pt  = out ? 'Slut' : av+' kvar';
    return `<div class="toy-card ${out?'out':''}" ${out?'':(`data-id="${esc(toy.id)}" onclick="confirmLoan('${esc(name)}',this.dataset.id)"`)}>
      <div class="toy-emoji">${toy.emoji}</div>
      <div class="toy-name">${esc(toy.name)}</div>
      <div class="toy-pill ${pc}">${pt} av ${toy.total}</div>
    </div>`;
  }).join('');
  setView(`${bc()}
    <div class="view-header"><h2>${esc(name)}</h2><p>Välj leksak att låna</p></div>
    <div class="toy-grid">${rows}</div>`);
}

function confirmLoan(child, toyId) {
  const toy = toys.find(t => t.id===toyId);
  if (!toy) { showToast('❌ Hittade inte leksaken'); return; }
  modal('Bekräfta lån', `${child} lånar ${toy.emoji} ${toy.name}`, '',
    [{l:'Avbryt', f:closeModal, s:'btn-ghost'},
     {l:'✅ Bekräfta', f:()=>{ doLoan(child,toy); closeModal(); }, s:'btn-primary'}]);
}

async function doLoan(child, toy) {
  if (toy.available <= 0) { showToast('❌ Inga kvar att låna'); return; }
  try {
    // Always read fresh available count before writing — prevents race conditions
    const freshDoc = await db.collection('toys').doc(toy.id).get();
    const fresh    = freshDoc.data();
    if (!fresh || fresh.available <= 0) { showToast('❌ Slut – någon annan lånade precis'); await loadAll(); viewChildren(nav.cls); return; }

    const loanRef = db.collection('loans').doc();
    const loan = {
      id: loanRef.id, child, cls: nav.cls, grade: nav.grade,
      toyId: toy.id, toyEmoji: toy.emoji, toyName: toy.name,
      time: new Date().toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'})
    };
    // Write loan + decrement available atomically via batch
    const batch = db.batch();
    batch.set(loanRef, {child:loan.child, cls:loan.cls, grade:loan.grade, toyId:loan.toyId, toyEmoji:loan.toyEmoji, toyName:loan.toyName, time:loan.time});
    batch.update(db.collection('toys').doc(toy.id), {available: firebase.firestore.FieldValue.increment(-1)});
    await batch.commit();

    loans.push(loan);
    toy.available--;
    badge();
    showToast('✅ '+child+' lånade '+toy.emoji+' '+toy.name);
    viewChildren(nav.cls);
  } catch(e) {
    console.warn('doLoan:', e);
    showToast('❌ Kunde inte spara lån – försök igen');
  }
}

function viewLoans() {
  if (!loans.length) {
    setView(`<div class="view-header"><h2>Aktiva lån</h2></div>${emptyEl('🧸','Inga aktiva lån just nu')}`);
    return;
  }
  const rows = loans.map(l => {
    const gn = grades.find(g => g.id===l.grade)?.name || '';
    return `<div class="loan-row">
      <div class="loan-icon">${l.toyEmoji}</div>
      <div class="loan-info">
        <div class="loan-name">${esc(l.child)} <span style="font-weight:400;color:var(--text-muted)">– ${esc(l.toyName)}</span></div>
        <div class="loan-meta">${esc(gn)} · ${esc(l.cls)} · Lånat ${l.time}</div>
      </div>
      <button class="btn-ret" onclick="retLoan('${esc(l.id)}')">↩ Lämna</button>
    </div>`;
  }).join('');
  setView(`<div class="view-header"><h2>Aktiva lån</h2><p>${loans.length} utlånade leksaker</p></div>
    <div class="loan-list">${rows}</div>`);
}

async function retLoan(id) {
  const l = loans.find(x => x.id===id);
  if (!l) { showToast('❌ Hittade inte lånet'); return; }
  try {
    const batch = db.batch();
    batch.delete(db.collection('loans').doc(id));
    batch.update(db.collection('toys').doc(l.toyId), {available: firebase.firestore.FieldValue.increment(1)});
    await batch.commit();

    loans = loans.filter(x => x.id!==id);
    const toy = toys.find(t => t.id===l.toyId);
    if (toy) toy.available++;
    badge();
    showToast('↩ '+l.child+' lämnade tillbaka '+l.toyEmoji);
    viewLoans();
  } catch(e) {
    console.warn('retLoan:', e);
    showToast('❌ Kunde inte uppdatera – försök igen');
  }
}

// ═══════════════════════════════════════════
//  ADMIN ACTIONS — TOYS
// ═══════════════════════════════════════════
async function addToy() {
  const em  = fv('a-em') || '🎯';
  const nm  = fv('a-tn');
  const cnt = parseInt(fv('a-tc')) || 1;
  if (!nm) { showToast('Ange ett namn'); return; }

  // Clean name-based ID
  let docId = nm.toLowerCase()
    .replace(/å/g,'a').replace(/ä/g,'a').replace(/ö/g,'o')
    .replace(/[^a-z0-9]/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'');
  let finalId = docId, suf = 2;
  while (toys.find(t => t.id===finalId)) { finalId = docId+'_'+suf; suf++; }

  const btn = document.getElementById('add-toy-btn');
  if (btn) { btn.disabled=true; btn.textContent='Sparar…'; }
  try {
    await db.collection('toys').doc(finalId).set({emoji:em, name:nm, total:cnt, available:cnt, active:true});
    toys.push({id:finalId, emoji:em, name:nm, total:cnt, available:cnt, active:true});
    showToast('✅ '+em+' '+nm+' sparad!');
    viewAdmin();
  } catch(e) {
    console.warn('addToy:', e);
    showToast('❌ Kunde inte spara – kontrollera Firebase-reglerna');
    if (btn) { btn.disabled=false; btn.textContent='+ Lägg till'; }
  }
}

async function chToy(id, d) {
  const t = toys.find(x => x.id===id);
  if (!t) return;
  const loaned = t.total - t.available;
  if (t.total+d < 1) { showToast('Minst 1 måste finnas'); return; }
  if (t.total+d < loaned) { showToast('Kan inte minska under utlånat antal ('+loaned+')'); return; }
  try {
    await db.collection('toys').doc(id).update({total: t.total+d, available: t.available+d});
    t.total += d; t.available += d;
    viewAdmin();
  } catch(e) { console.warn('chToy:', e); showToast('❌ Kunde inte uppdatera'); }
}

async function rmToy(id) {
  const t = toys.find(x => x.id===id);
  if (!t) return;
  if (t.total - t.available > 0) { showToast('Kan inte ta bort – finns utlånade'); return; }
  modal('Ta bort leksak', `Ta bort ${t.emoji} ${t.name}?`, '',
    [{l:'Avbryt', f:closeModal, s:'btn-ghost'},
     {l:'🗑 Ta bort', f:async()=>{
       try {
         await db.collection('toys').doc(id).delete();
         toys = toys.filter(x => x.id!==id);
         closeModal(); showToast('Borttagen'); viewAdmin();
       } catch(e) { console.warn('rmToy:', e); showToast('❌ Kunde inte ta bort'); }
     }, s:'btn-danger'}]);
}

async function toggleToyActive(id) {
  const toy = toys.find(t => t.id===id);
  if (!toy) return;
  const newActive = toy.active === false ? true : false;
  try {
    await db.collection('toys').doc(id).update({active: newActive});
    toy.active = newActive;
    showToast(newActive ? '✅ '+toy.name+' aktiverad' : '⏸ '+toy.name+' inaktiverad');
    viewAdmin();
  } catch(e) { console.warn('toggleToyActive:', e); showToast('❌ Kunde inte uppdatera'); }
}

async function resetAll() {
  modal('Återställ alla leksaker & lån',
    'Alla aktiva lån raderas och alla leksaker sätts till tillgängliga. Vill du fortsätta?', '',
    [{l:'Avbryt', f:closeModal, s:'btn-ghost'},
     {l:'🔄 Återställ', f:async()=>{
       try {
         const lSnap = await db.collection('loans').get();
         const batch = db.batch();
         lSnap.forEach(doc => batch.delete(doc.ref));
         toys.forEach(toy => batch.update(db.collection('toys').doc(toy.id), {available: toy.total}));
         await batch.commit();
         loans = [];
         toys.forEach(t => t.available = t.total);
         badge(); closeModal(); showToast('✅ Alla leksaker återställda!'); viewAdmin();
       } catch(e) { console.warn('resetAll:', e); showToast('❌ Fel – försök igen'); }
     }, s:'btn-danger'}]);
}

// ═══════════════════════════════════════════
//  ADMIN ACTIONS — GRADES & CLASSES
// ═══════════════════════════════════════════
async function addGrade() {
  const nm = fv('a-gn');
  if (!nm) { showToast('Ange ett namn'); return; }
  const emojis = ['4️⃣','5️⃣','6️⃣','🌿','⭐','🎯'];
  const order  = grades.length;
  const ref    = db.collection('grades').doc();
  const g      = {id:ref.id, name:'Åk '+nm, emoji:emojis[grades.length%emojis.length], classes:[], order};
  try {
    await ref.set({name:g.name, emoji:g.emoji, classes:g.classes, order:g.order});
    grades.push(g);
    showToast('✅ Årskurs tillagd'); viewAdmin();
  } catch(e) { console.warn('addGrade:', e); showToast('❌ Kunde inte spara'); }
}

async function rmGrade(id) {
  const g = grades.find(x => x.id===id);
  if (!g) return;
  modal('Ta bort '+g.name, 'Alla klasser och elever tas bort. Fortsätta?', '',
    [{l:'Avbryt', f:closeModal, s:'btn-ghost'},
     {l:'🗑 Ta bort', f:async()=>{
       try {
         const batch = db.batch();
         // Delete grade doc
         batch.delete(db.collection('grades').doc(id));
         // Delete all children in its classes
         for (const cls of g.classes) {
           (children[cls]||[]).forEach(c => batch.delete(db.collection('children').doc(c.docId)));
           delete children[cls];
         }
         // Remove loans for this grade
         loans.filter(l => l.grade===id).forEach(l => {
           batch.delete(db.collection('loans').doc(l.id));
           const toy = toys.find(t => t.id===l.toyId);
           if (toy) { toy.available++; batch.update(db.collection('toys').doc(toy.id), {available:toy.available}); }
         });
         await batch.commit();
         grades = grades.filter(x => x.id!==id);
         loans  = loans.filter(l => l.grade!==id);
         badge(); closeModal(); showToast('Borttagen'); viewAdmin();
       } catch(e) { console.warn('rmGrade:', e); showToast('❌ Kunde inte ta bort'); }
     }, s:'btn-danger'}]);
}

async function addCls() {
  const gid = fv('a-cg'), nm = fv('a-cn');
  if (!gid||!nm) { showToast('Välj årskurs och ange klassnamn'); return; }
  const g = grades.find(x => x.id===gid);
  if (!g) return;
  if (g.classes.includes(nm)) { showToast('Klassen finns redan'); return; }
  try {
    g.classes.push(nm);
    children[nm] = [];
    await db.collection('grades').doc(gid).update({classes: g.classes});
    showToast('✅ Klass '+nm+' tillagd'); viewAdmin();
  } catch(e) { g.classes.pop(); console.warn('addCls:', e); showToast('❌ Kunde inte spara'); }
}

async function rmCls(cls, gid) {
  modal('Ta bort '+cls, 'Alla elever i klassen tas bort. Fortsätta?', '',
    [{l:'Avbryt', f:closeModal, s:'btn-ghost'},
     {l:'🗑 Ta bort', f:async()=>{
       try {
         const g = grades.find(x => x.id===gid);
         const batch = db.batch();
         (children[cls]||[]).forEach(c => batch.delete(db.collection('children').doc(c.docId)));
         loans.filter(l => l.cls===cls).forEach(l => {
           batch.delete(db.collection('loans').doc(l.id));
           const toy = toys.find(t => t.id===l.toyId);
           if (toy) { toy.available++; batch.update(db.collection('toys').doc(toy.id), {available:toy.available}); }
         });
         if (g) {
           g.classes = g.classes.filter(c => c!==cls);
           batch.update(db.collection('grades').doc(gid), {classes:g.classes});
         }
         await batch.commit();
         delete children[cls];
         loans = loans.filter(l => l.cls!==cls);
         badge(); closeModal(); showToast('Klass borttagen'); viewAdmin();
       } catch(e) { console.warn('rmCls:', e); showToast('❌ Kunde inte ta bort'); }
     }, s:'btn-danger'}]);
}

// ═══════════════════════════════════════════
//  ADMIN ACTIONS — CHILDREN
// ═══════════════════════════════════════════
async function addChild() {
  const cls = fv('a-cc'), nm = fv('a-chname');
  if (!cls||!nm) { showToast('Välj klass och ange namn'); return; }
  if (!children[cls]) children[cls] = [];
  if (children[cls].find(c => c.name===nm)) { showToast(nm+' finns redan i klassen'); return; }
  try {
    const ref = db.collection('children').doc();
    await ref.set({cls, name:nm});
    children[cls].push({name:nm, docId:ref.id});
    showToast('✅ '+nm+' tillagd'); viewAdmin();
  } catch(e) { console.warn('addChild:', e); showToast('❌ Kunde inte spara'); }
}

async function rmChild(cls, nm, docId) {
  if (loans.find(l => l.child===nm && l.cls===cls)) { showToast('Eleven har aktivt lån – lämna tillbaka först'); return; }
  try {
    await db.collection('children').doc(docId).delete();
    children[cls] = (children[cls]||[]).filter(c => c.name!==nm);
    showToast(nm+' borttagen'); viewAdmin();
  } catch(e) { console.warn('rmChild:', e); showToast('❌ Kunde inte ta bort'); }
}

// ═══════════════════════════════════════════
//  PROMOTE
// ═══════════════════════════════════════════
async function promote(dir) {
  const up = dir > 0;
  modal(up?'Flytta upp alla':'Flytta ner alla',
    (up?'Elever i sista klassen tas bort (slutar).':'Elever i första klassen tas bort.')+' Lån nollställs. Fortsätta?', '',
    [{l:'Avbryt', f:closeModal, s:'btn-ghost'},
     {l:(up?'⬆️ Flytta upp':'⬇️ Flytta ner'), f:async()=>{
       try {
         // Build new children mapping
         const newC = {};
         grades.forEach((g,gi) => {
           g.classes.forEach((cls,ci) => {
             const tg = up ? grades[gi+1] : grades[gi-1];
             if (tg) {
               const tc = tg.classes[ci] || tg.classes[0];
               if (tc) {
                 if (!newC[tc]) newC[tc] = [];
                 (children[cls]||[]).forEach(c => newC[tc].push({name:c.name, docId:null}));
               }
             }
           });
         });
         grades.forEach(g => g.classes.forEach(c => { if (!newC[c]) newC[c] = []; }));

         // Delete all old children + loans from Firestore
         const oldCSnap = await db.collection('children').get();
         const oldLSnap = await db.collection('loans').get();
         const delBatch = db.batch();
         oldCSnap.forEach(d => delBatch.delete(d.ref));
         oldLSnap.forEach(d => delBatch.delete(d.ref));
         // Reset toy available counts
         toys.forEach(t => delBatch.update(db.collection('toys').doc(t.id), {available:t.total}));
         await delBatch.commit();

         // Save new children
         for (const [cls, arr] of Object.entries(newC)) {
           for (const c of arr) {
             const ref = db.collection('children').doc();
             await ref.set({cls, name:c.name});
             c.docId = ref.id;
           }
         }
         children = newC;
         loans = [];
         toys.forEach(t => t.available = t.total);
         badge(); closeModal(); showToast('✅ Klart!'); viewAdmin();
       } catch(e) { console.warn('promote:', e); showToast('❌ Fel – försök igen'); }
     }, s:'btn-primary'}]);
}

// ═══════════════════════════════════════════
//  MODAL
// ═══════════════════════════════════════════
function modal(title, desc, body, actions) {
  document.getElementById('mt').textContent = title;
  document.getElementById('md').textContent = desc;
  document.getElementById('mb').innerHTML   = body;
  const el = document.getElementById('ma'); el.innerHTML = '';
  actions.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'btn '+a.s; btn.textContent = a.l; btn.onclick = a.f;
    el.appendChild(btn);
  });
  document.getElementById('mbg').classList.remove('hidden');
}
function closeModal() { document.getElementById('mbg').classList.add('hidden'); }
function mbgClick(ev) { if (ev.target===document.getElementById('mbg')) closeModal(); }

// ═══════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════
let _tt;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(()=>el.classList.remove('show'), 2800);
}

//  HELPERS

function fv(id)    { return (document.getElementById(id)?.value||'').trim(); }
function emptyEl(icon, msg) { return `<div class="empty"><div class="ei">${icon}</div><p>${esc(msg)}</p></div>`; }

  await initData();
  await loadAll();
  go('klass');
}
startup();
